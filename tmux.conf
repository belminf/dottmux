# Dependency-free tmux config (tmux >= 3.2). Per-machine overrides: ~/.tmux.local.conf

# ── Palette (Catppuccin Mocha) ──
%hidden crust="#11111b"
%hidden mantle="#181825"
%hidden surface0="#313244"
%hidden surface1="#45475a"
%hidden surface2="#585b70"
%hidden text="#cdd6f4"
%hidden subtext="#a6adc8"
%hidden lavender="#b4befe"
%hidden yellow="#f9e2af"
%hidden red="#f38ba8"
%hidden peach="#fab387"
%hidden teal="#94e2d5"

# ── Core ──
unbind C-b
set -g prefix C-Space
bind C-Space last-window

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB:clipboard"
set -g escape-time 1
set -g history-limit 50000
set -g mouse on
set -g mode-keys vi
set -g base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g display-time 750
set -g focus-events on  # lets editors react to focus changes
set -g status-interval 15
set -g monitor-activity on
set -g visual-bell off
set -g automatic-rename off
set -g allow-rename off

bind R source-file ~/.tmux.conf \; display "reloaded"

# ── Windows ──
bind c   command-prompt -p "window name:" "new-window -c '#{pane_current_path}' -n '%%'"
bind C   run-shell "~/.tmux/rand_win_create.sh '#{pane_current_path}'"
bind .   command-prompt -I "#W" -p "rename:" "rename-window -- '%%'"
bind ,   command-prompt -p "swap with window:" "swap-window -t '%%'"
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind P   previous-window

# ── Panes ──
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind |  split-window -h  -c "#{pane_current_path}"
bind -  split-window -v  -c "#{pane_current_path}"
bind \\ split-window -fh -c "#{pane_current_path}"
bind _  split-window -fv -c "#{pane_current_path}"

bind S setw synchronize-panes

# Space cycles: tiled (even squares) -> even-horizontal (side by side) -> even-vertical (stacked)
bind Space if -F '#{==:#{@layout},tiled}' {
  select-layout even-horizontal ; set -w @layout even-horizontal
} {
  if -F '#{==:#{@layout},even-horizontal}' {
    select-layout even-vertical ; set -w @layout even-vertical
  } {
    select-layout tiled ; set -w @layout tiled
  }
}

# Move panes: reorder within the window, or move between windows
bind -r '{' swap-pane -U
bind -r '}' swap-pane -D
bind X command-prompt -p "send pane to window:" "join-pane -t '%%'"
bind M command-prompt -p "pull pane from window:" "join-pane -s '%%'"

# ── Copy / paste ──
# Copies reach the system clipboard via OSC 52, or a native tool if present.
set -g set-clipboard on
if -b 'command -v wl-copy' { set -s copy-command wl-copy } {
  if -b 'command -v pbcopy' { set -s copy-command pbcopy }
}
if -b 'command -v wl-paste' { bind -n MouseDown2Pane run -b "wl-paste -n | tmux load-buffer - && tmux paste-buffer -p" } {
  if -b 'command -v pbpaste' { bind -n MouseDown2Pane run -b "pbpaste | tmux load-buffer - && tmux paste-buffer -p" }
}

bind v copy-mode
bind p paste-buffer -p
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Look ──
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "fg=${text},bg=${mantle}"

set -g window-style        "fg=colour247,bg=colour233"
set -g window-active-style "fg=colour250,bg=black"
set -g pane-border-style        "fg=${surface1}"
set -g pane-active-border-style "fg=${lavender}"

# Left: ~/.tmux/monitors/*.sh output, if any
set -g status-left-length 100
set -g status-left "#(~/.tmux/run_monitors.sh)"

# Windows: " 1 name " — current is yellow; ↕ zoomed, ! bell, • activity
set -g window-status-separator ""
set -g window-status-format         "#[fg=${subtext},bg=${surface0}] #I #[fg=${text},bg=${surface1}] #W#{?window_zoomed_flag, ↕,}#{?window_bell_flag, !,}#{?window_activity_flag, •,} #[default] "
set -g window-status-current-format "#[fg=${crust},bg=${yellow},bold] #I #[fg=${text},bg=${surface2},bold] #W#{?window_zoomed_flag, ↕,} #[default] "
set -g window-status-current-style default
set -g window-status-bell-style     "fg=${red}"
set -g window-status-activity-style "fg=${peach}"

# Right: SYNC badge, Pacific + UTC clocks
set -g status-right-length 100
set -g status-right "#{?pane_synchronized,#[fg=${crust}#,bg=${red}#,bold] SYNC #[default] ,}#[fg=${lavender},bg=${surface0}] #(TZ=America/Los_Angeles date +'%%H:%%M %%Z') #[fg=${lavender},bg=${surface1}] #(date -u +'%%H:%%M %%Z') #[default]"

set -g message-style         "fg=${teal},bg=${mantle}"
set -g message-command-style "fg=${teal},bg=${mantle}"
set -g mode-style            "fg=${text},bg=${surface2}"

source-file -q ~/.tmux.local.conf
